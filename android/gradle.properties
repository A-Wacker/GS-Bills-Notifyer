org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Required by every androidx dependency. Without it AGP fails the build during
# dependency resolution with AndroidXDependencyCheck, which surfaces as an opaque
# stack trace rather than a readable message.
android.useAndroidX=true
# Each module gets its own R class instead of one containing every dependency's ids.
android.nonTransitiveRClass=true
